name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and Test
    runs-on: macos-26

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Record Swift toolchain
        run: |
          {
            echo "## Toolchain"
            echo '```'
            swift --version
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        run: swift build

      - name: Test
        run: swift test --parallel --xunit-output=test-results.xml

      - name: Publish test report
        uses: dorny/test-reporter@v2
        if: always()
        with:
          name: Swift Tests
          path: test-results*.xml
          reporter: swift-xunit
          report-title: Railengine test results
          badge-title: tests
          use-actions-summary: true
          fail-on-error: true
